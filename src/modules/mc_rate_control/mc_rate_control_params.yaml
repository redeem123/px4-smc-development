module_name: mc_rate_control
parameters:
- group: Multicopter Rate Control
  definitions:
    MC_ROLLRATE_P:
      description:
        short: Roll rate P gain
        long: Roll rate proportional gain, i.e. control output for angular speed error
          1 rad/s.
      type: float
      default: 0.15
      min: 0.01
      max: 0.5
      decimal: 3
      increment: 0.01
    MC_ROLLRATE_I:
      description:
        short: Roll rate I gain
        long: Roll rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.2
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_RR_INT_LIM:
      description:
        short: Roll rate integrator limit
        long: Roll rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large roll moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_ROLLRATE_D:
      description:
        short: Roll rate D gain
        long: Roll rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.003
      min: 0.0
      max: 0.01
      decimal: 4
      increment: 0.0005
    MC_ROLLRATE_FF:
      description:
        short: Roll rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_ROLLRATE_K:
      description:
        short: Roll rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_ROLLRATE_K * (MC_ROLLRATE_P * error
          + MC_ROLLRATE_I * error_integral
          + MC_ROLLRATE_D * error_derivative)
          ```
          Set MC_ROLLRATE_P=1 to implement a PID in the ideal form.
          Set MC_ROLLRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_PITCHRATE_P:
      description:
        short: Pitch rate P gain
        long: Pitch rate proportional gain, i.e. control output for angular speed
          error 1 rad/s.
      type: float
      default: 0.15
      min: 0.01
      max: 0.6
      decimal: 3
      increment: 0.01
    MC_PITCHRATE_I:
      description:
        short: Pitch rate I gain
        long: Pitch rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.2
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_PR_INT_LIM:
      description:
        short: Pitch rate integrator limit
        long: Pitch rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large pitch moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_PITCHRATE_D:
      description:
        short: Pitch rate D gain
        long: Pitch rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.003
      min: 0.0
      decimal: 4
      increment: 0.0005
    MC_PITCHRATE_FF:
      description:
        short: Pitch rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_PITCHRATE_K:
      description:
        short: Pitch rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_PITCHRATE_K * (MC_PITCHRATE_P * error
          + MC_PITCHRATE_I * error_integral
          + MC_PITCHRATE_D * error_derivative)
          ```
          Set MC_PITCHRATE_P=1 to implement a PID in the ideal form.
          Set MC_PITCHRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_YAWRATE_P:
      description:
        short: Yaw rate P gain
        long: Yaw rate proportional gain, i.e. control output for angular speed error
          1 rad/s.
      type: float
      default: 0.2
      min: 0.0
      max: 0.6
      decimal: 3
      increment: 0.01
    MC_YAWRATE_I:
      description:
        short: Yaw rate I gain
        long: Yaw rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.1
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_YR_INT_LIM:
      description:
        short: Yaw rate integrator limit
        long: Yaw rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large yaw moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_YAWRATE_D:
      description:
        short: Yaw rate D gain
        long: Yaw rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
      increment: 0.0005
    MC_YAWRATE_FF:
      description:
        short: Yaw rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_YAWRATE_K:
      description:
        short: Yaw rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_YAWRATE_K * (MC_YAWRATE_P * error
          + MC_YAWRATE_I * error_integral
          + MC_YAWRATE_D * error_derivative)
          ```
          Set MC_YAWRATE_P=1 to implement a PID in the ideal form.
          Set MC_YAWRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_BAT_SCALE_EN:
      description:
        short: Battery power level scaler
        long: |-
          This compensates for voltage drop of the battery over time by attempting to
          normalize performance across the operating range of the battery. The copter
          should constantly behave as if it was fully charged with reduced max acceleration
          at lower battery percentages. i.e. if hover is at 0.5 throttle at 100% battery,
          it will still be 0.5 at 60% battery.
      type: boolean
      default: 0
    MC_YAW_TQ_CUTOFF:
      description:
        short: Low pass filter cutoff frequency for yaw torque setpoint
        long: |-
          Reduces vibrations by lowering high frequency torque caused by rotor acceleration.
          0 disables the filter
      type: float
      default: 2.0
      min: 0
      max: 10
      unit: Hz
      decimal: 3
    MC_RATE_CTRL_T:
      description:
        short: Rate controller type
        long: Choose rate controller type. 0 = PID, 1 = model predictive control (MPC), 2 = model-based SMC, 3 = proper-implicit super-twisting SMC
      type: int32
      default: 0
      min: 0
      max: 3
    MC_MSMC_CFG:
      description:
        short: Model-based SMC model schema acknowledgment
        long: |-
          Set to 1 only after verifying that MC_MSMC_J_* are physical inertias in kg m^2,
          MC_MSMC_EFF_* are physical torque effectiveness values in Nm per normalized
          torque command, and all SMC limits match this vehicle. Model-based SMC cannot
          arm while this parameter is 0. Set this parameter last when importing a model card.
      type: enum
      values:
        0: Unreviewed or legacy model card
        1: Physical model card reviewed
      default: 0
    MC_AST_CFG:
      description:
        short: Implicit super-twisting model-card acknowledgment
        long: |-
          Set to 1 only after verifying MC_AST_J_*, MC_AST_EFF_*, fixed gains,
          torque limits, and the MC_AST_DT_MIN/MC_AST_DT_MAX timing interval for this vehicle. Type 3 cannot arm
          while this parameter is 0, MC_BAT_SCALE_EN is enabled, or the airframe
          is VTOL. Set this parameter last when importing a reviewed research card.
      type: enum
      values:
        0: Unreviewed implicit super-twisting card
        1: Implicit super-twisting card reviewed
      default: 0
    MC_MPC_J_R:
      description:
        short: Roll MPC inertia
        long: Physical diagonal inertia used by the rate MPC roll axis.
      type: float
      default: 0.01
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MPC_J_P:
      description:
        short: Pitch MPC inertia
        long: Physical diagonal inertia used by the rate MPC pitch axis.
      type: float
      default: 0.01
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MPC_J_Y:
      description:
        short: Yaw MPC inertia
        long: Physical diagonal inertia used by the rate MPC yaw axis.
      type: float
      default: 0.02
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MPC_EFF_R:
      description:
        short: Roll MPC torque effectiveness
        long: Physical roll torque in Nm generated by a unit normalized roll torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MPC_EFF_P:
      description:
        short: Pitch MPC torque effectiveness
        long: Physical pitch torque in Nm generated by a unit normalized pitch torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MPC_EFF_Y:
      description:
        short: Yaw MPC torque effectiveness
        long: Physical yaw torque in Nm generated by a unit normalized yaw torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MPC_Q_R:
      description:
        short: Roll MPC rate tracking weight
      type: float
      default: 1.0
      min: 0.0
      max: 100.0
    MC_MPC_Q_P:
      description:
        short: Pitch MPC rate tracking weight
      type: float
      default: 1.0
      min: 0.0
      max: 100.0
    MC_MPC_Q_Y:
      description:
        short: Yaw MPC rate tracking weight
      type: float
      default: 0.7
      min: 0.0
      max: 100.0
    MC_MPC_R_R:
      description:
        short: Roll MPC torque weight
      type: float
      default: 10.0
      min: 0.0
      max: 100.0
    MC_MPC_R_P:
      description:
        short: Pitch MPC torque weight
      type: float
      default: 10.0
      min: 0.0
      max: 100.0
    MC_MPC_R_Y:
      description:
        short: Yaw MPC torque weight
      type: float
      default: 10.0
      min: 0.0
      max: 100.0
    MC_MPC_DU_R:
      description:
        short: Roll MPC torque rate weight
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
    MC_MPC_DU_P:
      description:
        short: Pitch MPC torque rate weight
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
    MC_MPC_DU_Y:
      description:
        short: Yaw MPC torque rate weight
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
    MC_MPC_I_R:
      description:
        short: Roll MPC bias adaptation gain
        long: Integral adaptation gain for the roll rate MPC torque bias. MC_MPC_ILIM_R bounds the normalized disturbance estimate.
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
    MC_MPC_I_P:
      description:
        short: Pitch MPC bias adaptation gain
        long: Integral adaptation gain for the pitch rate MPC torque bias. MC_MPC_ILIM_P bounds the normalized disturbance estimate.
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
    MC_MPC_I_Y:
      description:
        short: Yaw MPC bias adaptation gain
        long: Integral adaptation gain for the yaw rate MPC torque bias. MC_MPC_ILIM_Y bounds the normalized disturbance estimate.
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
    MC_MPC_ILIM_R:
      description:
        short: Roll MPC bias limit
        long: Maximum absolute normalized roll torque disturbance estimate used by the MPC.
      type: float
      default: 0.3
      min: 0.0
      max: 1.0
    MC_MPC_ILIM_P:
      description:
        short: Pitch MPC bias limit
        long: Maximum absolute normalized pitch torque disturbance estimate used by the MPC.
      type: float
      default: 0.3
      min: 0.0
      max: 1.0
    MC_MPC_ILIM_Y:
      description:
        short: Yaw MPC bias limit
        long: Maximum absolute normalized yaw torque disturbance estimate used by the MPC.
      type: float
      default: 0.3
      min: 0.0
      max: 1.0
    MC_MPC_TMAX_R:
      description:
        short: Roll MPC torque limit
        long: Maximum absolute normalized roll torque command allowed by the rate MPC. Tune this below 1.0 when the actuator allocation limits are tighter than independent full-axis torque.
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MPC_TMAX_P:
      description:
        short: Pitch MPC torque limit
        long: Maximum absolute normalized pitch torque command allowed by the rate MPC. Tune this below 1.0 when the actuator allocation limits are tighter than independent full-axis torque.
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MPC_TMAX_Y:
      description:
        short: Yaw MPC torque limit
        long: Maximum absolute normalized yaw torque command allowed by the rate MPC. Tune this below 1.0 when the actuator allocation limits are tighter than independent full-axis torque.
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MPC_HORIZON:
      description:
        short: Rate MPC prediction horizon
        long: Number of fixed-step prediction samples used by the rate MPC.
      type: int32
      default: 6
      min: 1
      max: 8
    MC_MPC_SLEW:
      description:
        short: MPC maximum torque output slew rate limit
        long: Set to 0 to disable rate limiting.
      type: float
      default: 10.0
      min: 0.0
      max: 100.0
    MC_MPC_RSPD_L:
      description:
        short: MPC rate setpoint derivative feed-forward limit
        long: Maximum rate setpoint derivative used as model feed-forward by the rate MPC. Set to 0 to disable setpoint derivative feed-forward.
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      decimal: 2
    MC_MPC_GYRO:
      description:
        short: MPC gyro compensation blend
        long: Scales rigid-body gyroscopic compensation in the rate MPC model. Set to 0 for a hover-linear MPC and to 1 for full diagonal-rigid-body compensation.
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
    MC_MPC_TAU:
      description:
        short: MPC normalized torque actuator lag
        long: First-order time constant from normalized torque command to achieved torque. Set to 0 only for an identified direct-actuation model.
      type: float
      default: 0.02
      min: 0.0
      max: 0.2
      unit: s
      decimal: 4
    MC_AST_J_R:
      description:
        short: Roll implicit super-twisting inertia
        long: Physical diagonal roll inertia used to scale the reaching command into normalized torque.
      type: float
      default: 0.01
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_AST_J_P:
      description:
        short: Pitch implicit super-twisting inertia
        long: Physical diagonal pitch inertia used to scale the reaching command into normalized torque.
      type: float
      default: 0.01
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_AST_J_Y:
      description:
        short: Yaw implicit super-twisting inertia
        long: Physical diagonal yaw inertia used to scale the reaching command into normalized torque.
      type: float
      default: 0.02
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_AST_EFF_R:
      description:
        short: Roll implicit super-twisting torque effectiveness
        long: Physical roll torque in Nm generated by a unit normalized roll torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_AST_EFF_P:
      description:
        short: Pitch implicit super-twisting torque effectiveness
        long: Physical pitch torque in Nm generated by a unit normalized pitch torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_AST_EFF_Y:
      description:
        short: Yaw implicit super-twisting torque effectiveness
        long: Physical yaw torque in Nm generated by a unit normalized yaw torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_AST_K1_R:
      description:
        short: Roll implicit super-twisting first gain
        long: Fixed first gain of the proper-implicit super-twisting reaching law in rate-acceleration coordinates.
      type: float
      default: 3.0
      min: 0.01
      max: 100.0
      decimal: 3
    MC_AST_K1_P:
      description:
        short: Pitch implicit super-twisting first gain
        long: Fixed first gain of the proper-implicit super-twisting reaching law in rate-acceleration coordinates.
      type: float
      default: 3.0
      min: 0.01
      max: 100.0
      decimal: 3
    MC_AST_K1_Y:
      description:
        short: Yaw implicit super-twisting first gain
        long: Fixed first gain of the proper-implicit super-twisting reaching law in rate-acceleration coordinates.
      type: float
      default: 1.5
      min: 0.01
      max: 100.0
      decimal: 3
    MC_AST_K2_R:
      description:
        short: Roll implicit super-twisting second gain
        long: Fixed second gain driving the conditioned integral state in rate-acceleration coordinates.
      type: float
      default: 4.5
      min: 0.01
      max: 1000.0
      decimal: 3
    MC_AST_K2_P:
      description:
        short: Pitch implicit super-twisting second gain
        long: Fixed second gain driving the conditioned integral state in rate-acceleration coordinates.
      type: float
      default: 4.5
      min: 0.01
      max: 1000.0
      decimal: 3
    MC_AST_K2_Y:
      description:
        short: Yaw implicit super-twisting second gain
        long: Fixed second gain driving the conditioned integral state in rate-acceleration coordinates.
      type: float
      default: 1.5
      min: 0.01
      max: 1000.0
      decimal: 3
    MC_AST_TMAX_R:
      description:
        short: Roll implicit super-twisting torque limit
        long: Symmetric normalized roll torque bound used inside the conditioned implicit update.
      type: float
      default: 0.2
      min: 0.01
      max: 1.0
      decimal: 3
    MC_AST_TMAX_P:
      description:
        short: Pitch implicit super-twisting torque limit
        long: Symmetric normalized pitch torque bound used inside the conditioned implicit update.
      type: float
      default: 0.2
      min: 0.01
      max: 1.0
      decimal: 3
    MC_AST_TMAX_Y:
      description:
        short: Yaw implicit super-twisting torque limit
        long: Symmetric normalized yaw torque bound used inside the conditioned implicit update.
      type: float
      default: 0.17
      min: 0.01
      max: 1.0
      decimal: 3
    MC_AST_RACC_R:
      description:
        short: Roll ASTSMC reference acceleration limit
        long: Maximum acceleration of the internal realizable roll-rate reference.
      type: float
      default: 20.0
      min: 0.01
      max: 1000.0
      unit: rad/s^2
      decimal: 2
    MC_AST_RACC_P:
      description:
        short: Pitch ASTSMC reference acceleration limit
        long: Maximum acceleration of the internal realizable pitch-rate reference.
      type: float
      default: 20.0
      min: 0.01
      max: 1000.0
      unit: rad/s^2
      decimal: 2
    MC_AST_RACC_Y:
      description:
        short: Yaw ASTSMC reference acceleration limit
        long: Maximum acceleration of the internal realizable yaw-rate reference.
      type: float
      default: 5.0
      min: 0.01
      max: 1000.0
      unit: rad/s^2
      decimal: 2
    MC_AST_RJERK_R:
      description:
        short: Roll ASTSMC reference jerk limit
      type: float
      default: 100.0
      min: 0.01
      max: 10000.0
      unit: rad/s^3
      decimal: 2
    MC_AST_RJERK_P:
      description:
        short: Pitch ASTSMC reference jerk limit
      type: float
      default: 100.0
      min: 0.01
      max: 10000.0
      unit: rad/s^3
      decimal: 2
    MC_AST_RJERK_Y:
      description:
        short: Yaw ASTSMC reference jerk limit
      type: float
      default: 40.0
      min: 0.01
      max: 10000.0
      unit: rad/s^3
      decimal: 2
    MC_AST_TRES_R:
      description:
        short: Roll ASTSMC residual torque reserve
        long: Symmetric normalized roll torque reserved for the conditioned proper-implicit residual controller.
      type: float
      default: 0.10
      min: 0.001
      max: 1.0
      decimal: 3
    MC_AST_TRES_P:
      description:
        short: Pitch ASTSMC residual torque reserve
        long: Symmetric normalized pitch torque reserved for the conditioned proper-implicit residual controller.
      type: float
      default: 0.10
      min: 0.001
      max: 1.0
      decimal: 3
    MC_AST_TRES_Y:
      description:
        short: Yaw ASTSMC residual torque reserve
        long: Symmetric normalized yaw torque reserved for the conditioned proper-implicit residual controller.
      type: float
      default: 0.05
      min: 0.001
      max: 1.0
      decimal: 3
    MC_AST_RP_EXT:
      description:
        short: ASTSMC large-error roll/pitch residual extension
        long: |-
          Additional Type-3 roll/pitch residual torque authority released
          smoothly as the conditioned rate error leaves the quiet-hover
          envelope. Full extension is available at MC_AST_QK1_ERR. The base
          MC_AST_TRES_R/P authority and nominal feedforward partition remain
          unchanged. Zero preserves the static residual authority.
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      decimal: 3
    MC_AST_RP_K1_B:
      description:
        short: ASTSMC large-error roll/pitch K1 boost
        long: |-
          Additional Type-3 roll/pitch K1 reaching gain released only when
          the conditioned rate error exceeds MC_AST_QK1_ERR. The boost blends
          linearly to its full value at MC_AST_REC_ERR. Zero preserves the
          previous quiet and large-error trajectories. Yaw is unaffected.
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
      decimal: 2
    MC_AST_RP_AIR:
      description:
        short: ASTSMC per-command roll/pitch headroom
        long: |-
          Allow airborne Type 3 commands to request the allocator's existing
          roll/pitch airmode behavior for that command only. This preserves
          roll/pitch by adjusting collective thrust while yaw remains
          deprioritized under saturation. MC_AIRMODE is not changed. Disabled
          preserves configured allocator behavior.
      type: boolean
      default: 0
    MC_AST_YAW_EXT:
      description:
        short: Governed ASTSMC yaw residual extension
        long: |-
          Additional Type-3 yaw residual torque authority released only after
          sustained fresh allocator feedback demonstrates joint torque/thrust
          feasibility. Any allocator miss, actuator bound, or invalid feedback
          immediately returns authority to MC_AST_TRES_Y. Zero disables the
          governor extension and preserves the configured static reserve.
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      decimal: 3
    MC_AST_TAU_R:
      description:
        short: Roll ASTSMC actuator time constant
        long: Identified first-order normalized torque actuator time constant used inside the proper-implicit admissible-set projection. Set to 0 for the zero-lag recurrence.
      type: float
      default: 0.0
      min: 0.0
      max: 0.2
      unit: s
      decimal: 4
    MC_AST_TAU_P:
      description:
        short: Pitch ASTSMC actuator time constant
        long: Identified first-order normalized torque actuator time constant used inside the proper-implicit admissible-set projection. Set to 0 for the zero-lag recurrence.
      type: float
      default: 0.0
      min: 0.0
      max: 0.2
      unit: s
      decimal: 4
    MC_AST_TAU_Y:
      description:
        short: Yaw ASTSMC actuator time constant
        long: Identified first-order normalized torque actuator time constant used inside the proper-implicit admissible-set projection. Set to 0 for the zero-lag recurrence.
      type: float
      default: 0.0
      min: 0.0
      max: 0.2
      unit: s
      decimal: 4
    MC_AST_SLEW_R:
      description:
        short: Roll ASTSMC torque slew bound
        long: Maximum roll normalized torque-command rate represented inside the actuator-aware admissible set. Set to 0 to disable the slew constraint.
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      unit: 1/s
      decimal: 2
    MC_AST_SLEW_P:
      description:
        short: Pitch ASTSMC torque slew bound
        long: Maximum pitch normalized torque-command rate represented inside the actuator-aware admissible set. Set to 0 to disable the slew constraint.
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      unit: 1/s
      decimal: 2
    MC_AST_SLEW_Y:
      description:
        short: Yaw ASTSMC torque slew bound
        long: Maximum yaw normalized torque-command rate represented inside the actuator-aware admissible set. Set to 0 to disable the slew constraint.
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      unit: 1/s
      decimal: 2
    MC_AST_DU_R:
      description:
        short: Roll ASTSMC torque-variation weight
        long: Proximal penalty on roll predicted applied-torque variation after the unchanged proper-implicit update. The penalty fades to zero as the requested residual change approaches the reserved residual authority, preserving large-signal reaching authority. Set to 0 for legacy behavior.
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      decimal: 2
    MC_AST_DU_P:
      description:
        short: Pitch ASTSMC torque-variation weight
        long: Proximal penalty on pitch predicted applied-torque variation after the unchanged proper-implicit update. The penalty fades to zero as the requested residual change approaches the reserved residual authority, preserving large-signal reaching authority. Set to 0 for legacy behavior.
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      decimal: 2
    MC_AST_DU_Y:
      description:
        short: Yaw ASTSMC torque-variation weight
        long: Proximal penalty on yaw predicted applied-torque variation after the unchanged proper-implicit update. The penalty fades to zero as the requested residual change approaches the reserved residual authority, preserving large-signal reaching authority. Set to 0 for legacy behavior.
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      decimal: 2
    MC_AST_SBD_R:
      description:
        short: Roll ASTSMC tracking boundary
        long: Smooth boundary for the roll raw-to-shaped reference-gap recovery added to the realizable reference. Set to 0 for an unbounded linear recovery term.
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
      unit: rad/s
      decimal: 3
    MC_AST_SBD_P:
      description:
        short: Pitch ASTSMC tracking boundary
        long: Smooth boundary for the pitch raw-to-shaped reference-gap recovery added to the realizable reference. Set to 0 for an unbounded linear recovery term.
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
      unit: rad/s
      decimal: 3
    MC_AST_SBD_Y:
      description:
        short: Yaw ASTSMC tracking boundary
        long: Smooth boundary for the yaw raw-to-shaped reference-gap recovery added to the realizable reference. Set to 0 for an unbounded linear recovery term.
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
      unit: rad/s
      decimal: 3
    MC_AST_TRK_B:
      description:
        short: ASTSMC reference-gap tracking blend
        long: Blend from the jerk-limited realizable reference toward a smooth bounded correction based on the gap to the raw rate setpoint. The proper-implicit recursion and its conditioned state remain unchanged.
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      decimal: 2
    MC_AST_RFF:
      description:
        short: ASTSMC reference acceleration feedforward
        long: Master blend applied to the model-based normalized torque for the shaped rate-reference acceleration.
      type: float
      default: 1.0
      min: 0.0
      max: 1.0
      decimal: 2
    MC_AST_RFF_RP:
      description:
        short: Roll/pitch ASTSMC reference feedforward scale
        long: Additional roll/pitch multiplier for the shaped-reference acceleration feedforward. Yaw keeps the master MC_AST_RFF value so yaw authority can remain model assisted while roll/pitch nominal torque is reduced.
      type: float
      default: 1.0
      min: 0.0
      max: 1.0
      decimal: 2
    MC_AST_GYRO:
      description:
        short: ASTSMC gyroscopic compensation blend
        long: Blend applied to diagonal rigid-body gyroscopic torque compensation.
      type: float
      default: 1.0
      min: 0.0
      max: 1.0
      decimal: 2
    MC_AST_DT_MIN:
      description:
        short: Minimum implicit super-twisting update interval
        long: |-
          Minimum accepted gyro-sample interval for updating the type-3 internal
          state. Shorter intervals hold the last bounded command without advancing
          the realizable reference or conditioned state.
      type: float
      default: 0.0005
      min: 0.000125
      max: 0.02
      unit: s
      decimal: 6
    MC_AST_DT_MAX:
      description:
        short: Maximum implicit super-twisting update interval
        long: |-
          Maximum accepted gyro-sample interval for updating the type-3 internal
          state. Longer intervals hold the last bounded command without falling
          back to another controller.
      type: float
      default: 0.005
      min: 0.0005
      max: 0.02
      unit: s
      decimal: 4
    MC_AST_REC_ERR:
      description:
        short: ASTSMC stale-state recovery error threshold
        long: |-
          Minimum conditioned rate-error magnitude for per-axis stale-state
          recovery. Recovery is applied only when the retained transformed state
          reverses the reaching direction and the unchanged zero-state
          proper-implicit update is corrective. A recovery latches a runtime fault
          until reboot and never changes controller type.
      type: float
      default: 1.0
      min: 0.05
      max: 5.0
      unit: rad/s
      decimal: 2
    MC_AST_QK1_ERR:
      description:
        short: ASTSMC quiet-hover K1 transition error
        long: |-
          Roll/pitch conditioned-error magnitude at which the full configured K1
          is restored. The reaching step uses two-thirds of K1 through half this
          threshold, then blends linearly to full K1. Yaw is unchanged.
      type: float
      default: 0.25
      min: 0.05
      max: 5.0
      unit: rad/s
      decimal: 2
    MC_AST_REL_ERR:
      description:
        short: ASTSMC selective release error threshold
        long: Minimum roll/pitch conditioned error for trim-preserving selective state release. Must not exceed MC_AST_REC_ERR.
      type: float
      default: 0.2
      min: 0.05
      max: 5.0
      unit: rad/s
      decimal: 2
    MC_AST_REL_RATE:
      description:
        short: ASTSMC selective state release rate
        long: Maximum rate that the roll/pitch transformed state moves toward the learned neutral trim during selective release. Zero disables selective release.
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      unit: rad/s^3
      decimal: 1
    MC_AST_TRIM_CMD:
      description:
        short: ASTSMC neutral trim command threshold
        long: Raw roll/pitch rate-command magnitude required for neutral trim qualification. A wider exit threshold provides hysteresis.
      type: float
      default: 0.15
      min: 0.02
      max: 0.5
      unit: rad/s
      decimal: 2
    MC_AST_TRIM_ERR:
      description:
        short: ASTSMC neutral trim error threshold
        long: Conditioned roll/pitch rate-error magnitude required for neutral trim qualification. A wider exit threshold provides hysteresis.
      type: float
      default: 0.2
      min: 0.02
      max: 0.5
      unit: rad/s
      decimal: 2
    MC_AST_TRIM_ACC:
      description:
        short: ASTSMC neutral trim acceleration threshold
        long: Shaped-reference acceleration magnitude required for neutral trim qualification. This gate uses acceleration units independently of the command and error thresholds.
      type: float
      default: 1.0
      min: 0.1
      max: 10.0
      unit: rad/s^2
      decimal: 1
    MC_AST_TRIM_DWL:
      description:
        short: ASTSMC neutral trim confidence time
        long: Neutral confidence needed before trim becomes valid. Confidence decays gradually outside hysteresis rather than resetting after one sample.
      type: float
      default: 0.5
      min: 0.1
      max: 5.0
      unit: s
      decimal: 2
    MC_AST_TRIM_TC:
      description:
        short: ASTSMC trim estimator time constant
        long: Slow first-order time constant used after neutral trim has been acquired.
      type: float
      default: 20.0
      min: 1.0
      max: 100.0
      unit: s
      decimal: 1
    MC_MSMC_J_R:
      description:
        short: Roll model-based SMC inertia
        long: Physical diagonal roll inertia used by the model-based SMC.
      type: float
      default: 0.01
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MSMC_J_P:
      description:
        short: Pitch model-based SMC inertia
        long: Physical diagonal pitch inertia used by the model-based SMC.
      type: float
      default: 0.01
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MSMC_J_Y:
      description:
        short: Yaw model-based SMC inertia
        long: Physical diagonal yaw inertia used by the model-based SMC.
      type: float
      default: 0.02
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MSMC_EFF_R:
      description:
        short: Roll model-based SMC torque effectiveness
        long: Physical roll torque in Nm generated by a unit normalized roll torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MSMC_EFF_P:
      description:
        short: Pitch model-based SMC torque effectiveness
        long: Physical pitch torque in Nm generated by a unit normalized pitch torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MSMC_EFF_Y:
      description:
        short: Yaw model-based SMC torque effectiveness
        long: Physical yaw torque in Nm generated by a unit normalized yaw torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MSMC_C_R:
      description:
        short: Roll model-based SMC sliding surface gain
      type: float
      default: 0.8
      min: 0.1
      max: 10.0
    MC_MSMC_C_P:
      description:
        short: Pitch model-based SMC sliding surface gain
      type: float
      default: 0.8
      min: 0.1
      max: 10.0
    MC_MSMC_C_Y:
      description:
        short: Yaw model-based SMC sliding surface gain
      type: float
      default: 0.5
      min: 0.1
      max: 10.0
    MC_MSMC_ETA_R:
      description:
        short: Roll model-based SMC reaching gain
      type: float
      default: 0.5
      min: 0.0
      max: 10.0
    MC_MSMC_ETA_P:
      description:
        short: Pitch model-based SMC reaching gain
      type: float
      default: 0.5
      min: 0.0
      max: 10.0
    MC_MSMC_ETA_Y:
      description:
        short: Yaw model-based SMC reaching gain
      type: float
      default: 0.3
      min: 0.0
      max: 10.0
    MC_MSMC_BND_R:
      description:
        short: Roll model-based SMC boundary layer
      type: float
      default: 0.25
      min: 0.01
      max: 1.0
    MC_MSMC_BND_P:
      description:
        short: Pitch model-based SMC boundary layer
      type: float
      default: 0.25
      min: 0.01
      max: 1.0
    MC_MSMC_BND_Y:
      description:
        short: Yaw model-based SMC boundary layer
      type: float
      default: 0.25
      min: 0.01
      max: 1.0
    MC_MSMC_KS_R:
      description:
        short: Roll model-based SMC linear sliding gain
      type: float
      default: 0.05
      min: 0.0
      max: 5.0
    MC_MSMC_KS_P:
      description:
        short: Pitch model-based SMC linear sliding gain
      type: float
      default: 0.05
      min: 0.0
      max: 5.0
    MC_MSMC_KS_Y:
      description:
        short: Yaw model-based SMC linear sliding gain
      type: float
      default: 0.03
      min: 0.0
      max: 5.0
    MC_MSMC_RSPD_L:
      description:
        short: Model-based SMC rate setpoint derivative limit
        long: Limits the desired angular acceleration feed-forward term derived from rate setpoint changes. Keep disabled until physical inertia and torque effectiveness are identified.
      type: float
      default: 0.0
      min: 0.0
      max: 1000.0
      unit: rad/s^2
      decimal: 1
    MC_MSMC_ILIM_R:
      description:
        short: Roll model-based SMC error-integral limit
      type: float
      default: 0.3
      min: 0.0
      max: 5.0
      unit: rad
    MC_MSMC_ILIM_P:
      description:
        short: Pitch model-based SMC error-integral limit
      type: float
      default: 0.3
      min: 0.0
      max: 5.0
      unit: rad
    MC_MSMC_ILIM_Y:
      description:
        short: Yaw model-based SMC error-integral limit
      type: float
      default: 0.3
      min: 0.0
      max: 5.0
      unit: rad
    MC_MSMC_TMAX_R:
      description:
        short: Roll model-based SMC torque limit
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MSMC_TMAX_P:
      description:
        short: Pitch model-based SMC torque limit
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MSMC_TMAX_Y:
      description:
        short: Yaw model-based SMC torque limit
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MSMC_A1_R:
      description:
        short: Roll model-based SMC attitude surface slope
        long: Alpha1 of the Bouabdallah/Siegwart attitude sliding surface. Enables the -alpha1^2 roll-angle-error term. Set equal to MC_ROLL_P to match the outer loop. Zero disables the term and reproduces the plain rate-loop law.
      type: float
      default: 0.0
      min: 0.0
      max: 20.0
      decimal: 3
    MC_MSMC_A1_P:
      description:
        short: Pitch model-based SMC attitude surface slope
        long: Alpha1 of the Bouabdallah/Siegwart attitude sliding surface. Enables the -alpha1^2 pitch-angle-error term. Set equal to MC_PITCH_P to match the outer loop. Zero disables the term.
      type: float
      default: 0.0
      min: 0.0
      max: 20.0
      decimal: 3
    MC_MSMC_A1_Y:
      description:
        short: Yaw model-based SMC attitude surface slope
        long: Alpha1 of the Bouabdallah/Siegwart attitude sliding surface. Enables the -alpha1^2 yaw-angle-error term. Set equal to MC_YAW_P to match the outer loop. Zero disables the term.
      type: float
      default: 0.0
      min: 0.0
      max: 20.0
      decimal: 3
    MC_MSMC_JR:
      description:
        short: Model-based SMC propulsion-group inertia
        long: Rotor, gearbox, and propeller inertia J_R about the motor axis. Enables the propeller gyroscopic term -J_R*Omega applied to roll and pitch. Zero disables the term.
      type: float
      default: 0.0
      min: 0.0
      max: 0.1
      unit: kg m^2
      decimal: 6
    MC_MSMC_ROTOR_K:
      description:
        short: Model-based SMC propeller speed at full command
        long: Propeller angular speed produced by a full normalized motor command. Individual speeds are estimated as MC_MSMC_ROTOR_K*sqrt(command), because thrust is proportional to the squared speed. Only used when MC_MSMC_JR is non-zero.
      type: float
      default: 0.0
      min: 0.0
      max: 5000.0
      unit: rad/s
      decimal: 1
    MC_MSMC_ROTOR_D:
      description:
        short: Model-based SMC propeller direction mask
        long: Bitmask over the first twelve motors. A set bit marks a propeller whose speed enters the net rotor speed with a negative sign, matching the Omega definition of the reference model. Only used when MC_MSMC_JR is non-zero.
      type: int32
      default: 0
      min: 0
      max: 4095
      bit:
        0: Motor 1 reversed
        1: Motor 2 reversed
        2: Motor 3 reversed
        3: Motor 4 reversed
        4: Motor 5 reversed
        5: Motor 6 reversed
        6: Motor 7 reversed
        7: Motor 8 reversed
        8: Motor 9 reversed
        9: Motor 10 reversed
        10: Motor 11 reversed
        11: Motor 12 reversed
    MC_SMC_LPF:
      description:
        short: Cutoff frequency for SMC sliding surface LPF
        long: Set to 0 to disable the filter.
      type: float
      default: 20.0
      min: 0.0
      max: 100.0
      unit: Hz
    MC_SMC_SLEW:
      description:
        short: SMC maximum torque output slew rate limit
        long: Set to 0 to disable rate limiting.
      type: float
      default: 10.0
      min: 0.0
      max: 100.0
    MC_SMC_WD_ERR:
      description:
        short: SMC Watchdog rate error threshold
        long: SMC watchdog threshold retained for parameter compatibility. This research build does not fall back to PID on large tracking error.
      type: float
      default: 1.0
      min: 0.0
      max: 5.0
      unit: rad/s
    MC_SMC_WD_TOUT:
      description:
        short: SMC Watchdog error timeout duration
        long: Retained for parameter compatibility. This research build does not fall back to PID on watchdog timeout.
      type: float
      default: 1.0
      min: 0.1
      max: 5.0
      unit: s
