module_name: mc_rate_control
parameters:
- group: Multicopter Rate Control
  definitions:
    MC_ROLLRATE_P:
      description:
        short: Roll rate P gain
        long: Roll rate proportional gain, i.e. control output for angular speed error
          1 rad/s.
      type: float
      default: 0.15
      min: 0.01
      max: 0.5
      decimal: 3
      increment: 0.01
    MC_ROLLRATE_I:
      description:
        short: Roll rate I gain
        long: Roll rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.2
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_RR_INT_LIM:
      description:
        short: Roll rate integrator limit
        long: Roll rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large roll moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_ROLLRATE_D:
      description:
        short: Roll rate D gain
        long: Roll rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.003
      min: 0.0
      max: 0.01
      decimal: 4
      increment: 0.0005
    MC_ROLLRATE_FF:
      description:
        short: Roll rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_ROLLRATE_K:
      description:
        short: Roll rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_ROLLRATE_K * (MC_ROLLRATE_P * error
          + MC_ROLLRATE_I * error_integral
          + MC_ROLLRATE_D * error_derivative)
          ```
          Set MC_ROLLRATE_P=1 to implement a PID in the ideal form.
          Set MC_ROLLRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_PITCHRATE_P:
      description:
        short: Pitch rate P gain
        long: Pitch rate proportional gain, i.e. control output for angular speed
          error 1 rad/s.
      type: float
      default: 0.15
      min: 0.01
      max: 0.6
      decimal: 3
      increment: 0.01
    MC_PITCHRATE_I:
      description:
        short: Pitch rate I gain
        long: Pitch rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.2
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_PR_INT_LIM:
      description:
        short: Pitch rate integrator limit
        long: Pitch rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large pitch moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_PITCHRATE_D:
      description:
        short: Pitch rate D gain
        long: Pitch rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.003
      min: 0.0
      decimal: 4
      increment: 0.0005
    MC_PITCHRATE_FF:
      description:
        short: Pitch rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_PITCHRATE_K:
      description:
        short: Pitch rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_PITCHRATE_K * (MC_PITCHRATE_P * error
          + MC_PITCHRATE_I * error_integral
          + MC_PITCHRATE_D * error_derivative)
          ```
          Set MC_PITCHRATE_P=1 to implement a PID in the ideal form.
          Set MC_PITCHRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_YAWRATE_P:
      description:
        short: Yaw rate P gain
        long: Yaw rate proportional gain, i.e. control output for angular speed error
          1 rad/s.
      type: float
      default: 0.2
      min: 0.0
      max: 0.6
      decimal: 3
      increment: 0.01
    MC_YAWRATE_I:
      description:
        short: Yaw rate I gain
        long: Yaw rate integral gain. Can be set to compensate static thrust difference
          or gravity center offset.
      type: float
      default: 0.1
      min: 0.0
      decimal: 3
      increment: 0.01
    MC_YR_INT_LIM:
      description:
        short: Yaw rate integrator limit
        long: Yaw rate integrator limit. Can be set to increase the amount of integrator
          available to counteract disturbances or reduced to improve settling time
          after large yaw moment trim changes.
      type: float
      default: 0.3
      min: 0.0
      decimal: 2
      increment: 0.01
    MC_YAWRATE_D:
      description:
        short: Yaw rate D gain
        long: Yaw rate differential gain. Small values help reduce fast oscillations.
          If value is too big oscillations will appear again.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
      increment: 0.0005
    MC_YAWRATE_FF:
      description:
        short: Yaw rate feedforward
        long: Improves tracking performance.
      type: float
      default: 0.0
      min: 0.0
      decimal: 4
    MC_YAWRATE_K:
      description:
        short: Yaw rate controller gain
        long: |-
          Global gain of the controller.

          This gain scales the P, I and D terms of the controller:
          ```
          output = MC_YAWRATE_K * (MC_YAWRATE_P * error
          + MC_YAWRATE_I * error_integral
          + MC_YAWRATE_D * error_derivative)
          ```
          Set MC_YAWRATE_P=1 to implement a PID in the ideal form.
          Set MC_YAWRATE_K=1 to implement a PID in the parallel form.
      type: float
      default: 1.0
      min: 0.01
      max: 5.0
      decimal: 4
      increment: 0.0005
    MC_BAT_SCALE_EN:
      description:
        short: Battery power level scaler
        long: |-
          This compensates for voltage drop of the battery over time by attempting to
          normalize performance across the operating range of the battery. The copter
          should constantly behave as if it was fully charged with reduced max acceleration
          at lower battery percentages. i.e. if hover is at 0.5 throttle at 100% battery,
          it will still be 0.5 at 60% battery.
      type: boolean
      default: 0
    MC_YAW_TQ_CUTOFF:
      description:
        short: Low pass filter cutoff frequency for yaw torque setpoint
        long: |-
          Reduces vibrations by lowering high frequency torque caused by rotor acceleration.
          0 disables the filter
      type: float
      default: 2.0
      min: 0
      max: 10
      unit: Hz
      decimal: 3
    MC_RATE_CTRL_T:
      description:
        short: Rate controller type
        long: Choose rate controller type. 0 = PID, 1 = model predictive control (MPC), 2 = model-based SMC
      type: int32
      default: 0
      min: 0
      max: 2
    MC_MSMC_CFG:
      description:
        short: Model-based SMC model schema acknowledgment
        long: |-
          Set to 1 only after verifying that MC_MSMC_J_* are physical inertias in kg m^2,
          MC_MSMC_EFF_* are physical torque effectiveness values in Nm per normalized
          torque command, and all SMC limits match this vehicle. Model-based SMC cannot
          arm while this parameter is 0. Set this parameter last when importing a model card.
      type: enum
      values:
        0: Unreviewed or legacy model card
        1: Physical model card reviewed
      default: 0
    MC_MPC_J_R:
      description:
        short: Roll MPC inertia
        long: Physical diagonal inertia used by the rate MPC roll axis.
      type: float
      default: 0.01
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MPC_J_P:
      description:
        short: Pitch MPC inertia
        long: Physical diagonal inertia used by the rate MPC pitch axis.
      type: float
      default: 0.01
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MPC_J_Y:
      description:
        short: Yaw MPC inertia
        long: Physical diagonal inertia used by the rate MPC yaw axis.
      type: float
      default: 0.02
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MPC_EFF_R:
      description:
        short: Roll MPC torque effectiveness
        long: Physical roll torque in Nm generated by a unit normalized roll torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MPC_EFF_P:
      description:
        short: Pitch MPC torque effectiveness
        long: Physical pitch torque in Nm generated by a unit normalized pitch torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MPC_EFF_Y:
      description:
        short: Yaw MPC torque effectiveness
        long: Physical yaw torque in Nm generated by a unit normalized yaw torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MPC_Q_R:
      description:
        short: Roll MPC rate tracking weight
      type: float
      default: 1.0
      min: 0.0
      max: 100.0
    MC_MPC_Q_P:
      description:
        short: Pitch MPC rate tracking weight
      type: float
      default: 1.0
      min: 0.0
      max: 100.0
    MC_MPC_Q_Y:
      description:
        short: Yaw MPC rate tracking weight
      type: float
      default: 0.7
      min: 0.0
      max: 100.0
    MC_MPC_R_R:
      description:
        short: Roll MPC torque weight
      type: float
      default: 10.0
      min: 0.0
      max: 100.0
    MC_MPC_R_P:
      description:
        short: Pitch MPC torque weight
      type: float
      default: 10.0
      min: 0.0
      max: 100.0
    MC_MPC_R_Y:
      description:
        short: Yaw MPC torque weight
      type: float
      default: 10.0
      min: 0.0
      max: 100.0
    MC_MPC_DU_R:
      description:
        short: Roll MPC torque rate weight
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
    MC_MPC_DU_P:
      description:
        short: Pitch MPC torque rate weight
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
    MC_MPC_DU_Y:
      description:
        short: Yaw MPC torque rate weight
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
    MC_MPC_I_R:
      description:
        short: Roll MPC bias adaptation gain
        long: Integral adaptation gain for the roll rate MPC torque bias. MC_MPC_ILIM_R bounds the normalized disturbance estimate.
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
    MC_MPC_I_P:
      description:
        short: Pitch MPC bias adaptation gain
        long: Integral adaptation gain for the pitch rate MPC torque bias. MC_MPC_ILIM_P bounds the normalized disturbance estimate.
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
    MC_MPC_I_Y:
      description:
        short: Yaw MPC bias adaptation gain
        long: Integral adaptation gain for the yaw rate MPC torque bias. MC_MPC_ILIM_Y bounds the normalized disturbance estimate.
      type: float
      default: 0.0
      min: 0.0
      max: 10.0
    MC_MPC_ILIM_R:
      description:
        short: Roll MPC bias limit
        long: Maximum absolute normalized roll torque disturbance estimate used by the MPC.
      type: float
      default: 0.3
      min: 0.0
      max: 1.0
    MC_MPC_ILIM_P:
      description:
        short: Pitch MPC bias limit
        long: Maximum absolute normalized pitch torque disturbance estimate used by the MPC.
      type: float
      default: 0.3
      min: 0.0
      max: 1.0
    MC_MPC_ILIM_Y:
      description:
        short: Yaw MPC bias limit
        long: Maximum absolute normalized yaw torque disturbance estimate used by the MPC.
      type: float
      default: 0.3
      min: 0.0
      max: 1.0
    MC_MPC_TMAX_R:
      description:
        short: Roll MPC torque limit
        long: Maximum absolute normalized roll torque command allowed by the rate MPC. Tune this below 1.0 when the actuator allocation limits are tighter than independent full-axis torque.
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MPC_TMAX_P:
      description:
        short: Pitch MPC torque limit
        long: Maximum absolute normalized pitch torque command allowed by the rate MPC. Tune this below 1.0 when the actuator allocation limits are tighter than independent full-axis torque.
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MPC_TMAX_Y:
      description:
        short: Yaw MPC torque limit
        long: Maximum absolute normalized yaw torque command allowed by the rate MPC. Tune this below 1.0 when the actuator allocation limits are tighter than independent full-axis torque.
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MPC_HORIZON:
      description:
        short: Rate MPC prediction horizon
        long: Number of fixed-step prediction samples used by the rate MPC.
      type: int32
      default: 6
      min: 1
      max: 8
    MC_MPC_SLEW:
      description:
        short: MPC maximum torque output slew rate limit
        long: Set to 0 to disable rate limiting.
      type: float
      default: 10.0
      min: 0.0
      max: 100.0
    MC_MPC_RSPD_L:
      description:
        short: MPC rate setpoint derivative feed-forward limit
        long: Maximum rate setpoint derivative used as model feed-forward by the rate MPC. Set to 0 to disable setpoint derivative feed-forward.
      type: float
      default: 0.0
      min: 0.0
      max: 100.0
      decimal: 2
    MC_MPC_GYRO:
      description:
        short: MPC gyro compensation blend
        long: Scales rigid-body gyroscopic compensation in the rate MPC model. Set to 0 for a hover-linear MPC and to 1 for full diagonal-rigid-body compensation.
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
    MC_MPC_TAU:
      description:
        short: MPC normalized torque actuator lag
        long: First-order time constant from normalized torque command to achieved torque. Set to 0 only for an identified direct-actuation model.
      type: float
      default: 0.02
      min: 0.0
      max: 0.2
      unit: s
      decimal: 4
    MC_MSMC_J_R:
      description:
        short: Roll model-based SMC inertia
        long: Physical diagonal roll inertia used by the model-based SMC.
      type: float
      default: 0.01
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MSMC_J_P:
      description:
        short: Pitch model-based SMC inertia
        long: Physical diagonal pitch inertia used by the model-based SMC.
      type: float
      default: 0.01
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MSMC_J_Y:
      description:
        short: Yaw model-based SMC inertia
        long: Physical diagonal yaw inertia used by the model-based SMC.
      type: float
      default: 0.02
      min: 0.0001
      max: 5.0
      decimal: 4
    MC_MSMC_EFF_R:
      description:
        short: Roll model-based SMC torque effectiveness
        long: Physical roll torque in Nm generated by a unit normalized roll torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MSMC_EFF_P:
      description:
        short: Pitch model-based SMC torque effectiveness
        long: Physical pitch torque in Nm generated by a unit normalized pitch torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MSMC_EFF_Y:
      description:
        short: Yaw model-based SMC torque effectiveness
        long: Physical yaw torque in Nm generated by a unit normalized yaw torque command.
      type: float
      default: 1.0
      min: 0.0001
      max: 10.0
      decimal: 4
    MC_MSMC_C_R:
      description:
        short: Roll model-based SMC sliding surface gain
      type: float
      default: 0.8
      min: 0.1
      max: 10.0
    MC_MSMC_C_P:
      description:
        short: Pitch model-based SMC sliding surface gain
      type: float
      default: 0.8
      min: 0.1
      max: 10.0
    MC_MSMC_C_Y:
      description:
        short: Yaw model-based SMC sliding surface gain
      type: float
      default: 0.5
      min: 0.1
      max: 10.0
    MC_MSMC_ETA_R:
      description:
        short: Roll model-based SMC reaching gain
      type: float
      default: 0.5
      min: 0.0
      max: 10.0
    MC_MSMC_ETA_P:
      description:
        short: Pitch model-based SMC reaching gain
      type: float
      default: 0.5
      min: 0.0
      max: 10.0
    MC_MSMC_ETA_Y:
      description:
        short: Yaw model-based SMC reaching gain
      type: float
      default: 0.3
      min: 0.0
      max: 10.0
    MC_MSMC_BND_R:
      description:
        short: Roll model-based SMC boundary layer
      type: float
      default: 0.25
      min: 0.01
      max: 1.0
    MC_MSMC_BND_P:
      description:
        short: Pitch model-based SMC boundary layer
      type: float
      default: 0.25
      min: 0.01
      max: 1.0
    MC_MSMC_BND_Y:
      description:
        short: Yaw model-based SMC boundary layer
      type: float
      default: 0.25
      min: 0.01
      max: 1.0
    MC_MSMC_KS_R:
      description:
        short: Roll model-based SMC linear sliding gain
      type: float
      default: 0.05
      min: 0.0
      max: 5.0
    MC_MSMC_KS_P:
      description:
        short: Pitch model-based SMC linear sliding gain
      type: float
      default: 0.05
      min: 0.0
      max: 5.0
    MC_MSMC_KS_Y:
      description:
        short: Yaw model-based SMC linear sliding gain
      type: float
      default: 0.03
      min: 0.0
      max: 5.0
    MC_MSMC_RSPD_L:
      description:
        short: Model-based SMC rate setpoint derivative limit
        long: Limits the desired angular acceleration feed-forward term derived from rate setpoint changes. Keep disabled until physical inertia and torque effectiveness are identified.
      type: float
      default: 0.0
      min: 0.0
      max: 1000.0
      unit: rad/s^2
      decimal: 1
    MC_MSMC_ILIM_R:
      description:
        short: Roll model-based SMC error-integral limit
      type: float
      default: 0.3
      min: 0.0
      max: 5.0
      unit: rad
    MC_MSMC_ILIM_P:
      description:
        short: Pitch model-based SMC error-integral limit
      type: float
      default: 0.3
      min: 0.0
      max: 5.0
      unit: rad
    MC_MSMC_ILIM_Y:
      description:
        short: Yaw model-based SMC error-integral limit
      type: float
      default: 0.3
      min: 0.0
      max: 5.0
      unit: rad
    MC_MSMC_TMAX_R:
      description:
        short: Roll model-based SMC torque limit
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MSMC_TMAX_P:
      description:
        short: Pitch model-based SMC torque limit
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_MSMC_TMAX_Y:
      description:
        short: Yaw model-based SMC torque limit
      type: float
      default: 1.0
      min: 0.01
      max: 1.0
    MC_SMC_LPF:
      description:
        short: Cutoff frequency for SMC sliding surface LPF
        long: Set to 0 to disable the filter.
      type: float
      default: 20.0
      min: 0.0
      max: 100.0
      unit: Hz
    MC_SMC_SLEW:
      description:
        short: SMC maximum torque output slew rate limit
        long: Set to 0 to disable rate limiting.
      type: float
      default: 10.0
      min: 0.0
      max: 100.0
    MC_SMC_WD_ERR:
      description:
        short: SMC Watchdog rate error threshold
        long: SMC watchdog threshold retained for parameter compatibility. This research build does not fall back to PID on large tracking error.
      type: float
      default: 1.0
      min: 0.0
      max: 5.0
      unit: rad/s
    MC_SMC_WD_TOUT:
      description:
        short: SMC Watchdog error timeout duration
        long: Retained for parameter compatibility. This research build does not fall back to PID on watchdog timeout.
      type: float
      default: 1.0
      min: 0.1
      max: 5.0
      unit: s
